{% extends "base.html" %}
{% load static %}

{% block title %}{{ page_title }}{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
<link rel="stylesheet" href="{% static 'css/animations.css' %}">
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="card border-0 shadow-sm glass-card mx-auto" style="max-width: 760px;">
        <div class="card-body p-5 text-center">
            <div class="telegram-error-icon mx-auto mb-3"><i class="bi bi-binoculars"></i></div>
            <h1 class="display-6 fw-bold mb-3">{{ page_title }}</h1>
            <p class="text-muted mb-4">{{ message }}</p>
            <div class="d-flex flex-wrap justify-content-center gap-2">
                <a href="/targets/" class="btn btn-primary"><i class="bi bi-hdd-stack me-2"></i>Targets</a>
                <a href="/" class="btn btn-outline-dark"><i class="bi bi-grid me-2"></i>Dashboard</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
