{% extends "base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 mb-3">{{ page_title }}</h1>
                    <p class="mb-4">
                        <strong>{{ object.name }}</strong> targetini o'chirmoqchimisiz?
                    </p>
                    <div class="small text-muted mb-4">URL: {{ object.url }}</div>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between gap-2">
                            <a href="/targets/" class="btn btn-outline-secondary">Bekor qilish</a>
                            <button type="submit" class="btn btn-danger">O'chirish</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
