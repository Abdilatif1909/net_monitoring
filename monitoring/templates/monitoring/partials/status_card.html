<div class="col-sm-6 col-xl-3">
    <div class="metric-box glass-card stat-card h-100 {{ extra_class|default:'' }}">
        <div class="stat-icon {{ icon_bg_class }} {{ icon_text_class }}"><i class="bi {{ icon }}"></i></div>
        <div class="small text-muted mb-1">{{ title }}</div>
        <div class="h4 mb-1">{{ value }}</div>
        {% if subtitle %}
        <div class="small">{{ subtitle }}</div>
        {% endif %}
        {% if progress_value or progress_value == 0 %}
        <div class="progress soft-progress mt-2" role="progressbar" aria-label="{{ title }}" aria-valuenow="{{ progress_value }}" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-bar {{ progress_class }}" style="width: {{ progress_value }}%"></div>
        </div>
        {% endif %}
    </div>
</div>
